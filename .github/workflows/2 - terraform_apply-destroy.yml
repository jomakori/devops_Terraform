name: Terraform Apply/Destroy

on:
  workflow_dispatch: # manual run fallback
    inputs:
      workspace:
        description: Terraform workspace dir, e.g. k8s-maklab-cluster
        required: true
        default: k8s-maklab-cluster
      action:
        description: Whether to apply or destroy the workspace
        type: choice
        options:
          - apply
          - destroy
        default: apply
  issue_comment:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Terraform Changes
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, 'terraform apply') || contains(github.event.comment.body, 'terraform destroy')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      destroy: ${{ steps.destroy.outputs.destroy }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Detect Terraform Workspace Changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch: workspace and action come from the inputs, not a diff.
            workspaces="${{ inputs.workspace }}"
            echo "Detected Terraform Workspace changes on: $workspaces (manual dispatch)"
          else
            # check - Only allow changes on a single workspace
            workspaces=$(git diff --name-only origin/main HEAD | awk -F/ '!/^\.|^\// && /\// {print $1}' | sort | uniq)
            count=$(echo "$workspaces" | wc -l)

            if [ -z "$workspaces" ]; then
              echo "No Terraform changes detected - Skipping workflow..."
            elif [ $count -eq 1 ]; then
              echo "Detected Terraform Workspace changes on: $workspaces"
            else
              echo "Error: Too many workspaces detected: $count"
              echo "You can only make changes on 1 workspace per PR"
              echo "Terraform Workspaces detected: $workspaces"
              exit 1
            fi
          fi

          # Pass workspace name to outputs
          echo "changed=$workspaces" >> $GITHUB_OUTPUT

      - name: Check - Terraform Apply or Destroy
        if: steps.detect.outputs.changed != '' # if null - skip
        id: destroy
        run: |
          # Grab changed workspace
          dir_string=${{ steps.detect.outputs.changed }}

          # Trigger Terraform Apply or Destroy
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.action }}" = "destroy" ]; then
              echo "Trigger Terraform Destroy on: $dir_string"
              echo "destroy=true" >> $GITHUB_OUTPUT
            else
              echo "Trigger Terraform Apply on: $dir_string"
              echo "destroy=false" >> $GITHUB_OUTPUT
            fi
          elif [ -d $dir_string ]; then
            echo "Trigger Terraform Apply on: $dir_string"
            echo "destroy=false" >> $GITHUB_OUTPUT
          else
            echo "Trigger Terraform Destroy on: $dir_string"
            echo "destroy=true" >> $GITHUB_OUTPUT
          fi

  terraform-apply-destroy:
    # Workflow is triggered by previous job
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, 'terraform apply') || contains(github.event.comment.body, 'terraform destroy')
    runs-on: ubuntu-latest # whitelisted
    name: Apply Changes # Terraform Apply or Destroy, depending on destroy output
    needs: detect-changes
    env:
      WORKSPACE: ${{ needs.detect-changes.outputs.changed }}
      DESTROY: ${{ needs.detect-changes.outputs.destroy }}
      PR_NUM: ${{ github.event_name == 'issue_comment' && github.event.issue.number || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          # Conditional, based on type of plan (since destroy plan needs the deleted workspace contents)
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || (env.DESTROY == 'true' && 'main' || format('refs/pull/{0}/head', env.PR_NUM)) }}

      - name: Install Doppler cli
        uses: dopplerhq/cli-action@master

      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@main
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: devops
          doppler-config: ci
          inject-env-vars: true

      # Tailnet k8s access (runner-side: container actions can't reach tailnet)
      - name: Connect to Tailscale
        uses: tailscale/github-action@main
        with:
          authkey: ${{ env.TAILSCALE_AUTH_KEY }}

      - name: Configure kubectl
        run: |
          tailscale configure kubeconfig ${{ env.TAILSCALE_PROXY_HOST }}
          kubectl config current-context

      # AWS/GKE auth disabled — local k3s via Tailscale
      # - name: Setup AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@main
      #   with:
      #     aws-region: ${{ env.DEFAULT_AWS_REGION }}
      #     aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6

      - name: Setup TF_summarize
        run: go install github.com/jomakori/TF_summarize@main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color
        working-directory: ${{ env.WORKSPACE }}

      - name: Terraform Apply
        if: env.DESTROY == 'false'
        env:
          TF_WORKSPACE: ${{ env.WORKSPACE }}
          TF_PHASE: apply
          TF_OUTPUT: gha,pr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          terraform apply -input=false -no-color -lock-timeout=5m -auto-approve 2>&1 | TF_summarize
        working-directory: ${{ env.WORKSPACE }}

      - name: Terraform Destroy
        if: env.DESTROY == 'true'
        env:
          TF_WORKSPACE: ${{ env.WORKSPACE }}
          TF_PHASE: apply
          TF_OUTPUT: gha,pr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          terraform destroy -input=false -no-color -lock-timeout=5m -auto-approve 2>&1 | TF_summarize
        working-directory: ${{ env.WORKSPACE }}
