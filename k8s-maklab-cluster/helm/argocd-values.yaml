# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Production ArgoCD — HA, anti-affinity, PDB, resource limits              │
# └──────────────────────────────────────────────────────────────────────────┘

global:
    podAntiAffinity: hard

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Application Controller                                                   │
# └──────────────────────────────────────────────────────────────────────────┘
controller:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "2Gi"
  pdb:
    enabled: true
    minAvailable: 1

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ConfigMap                                                                │
# └──────────────────────────────────────────────────────────────────────────┘
configs:
  params:
    server.insecure: true
  cm:
    create: true
    exec.enabled: true
    helm.timeout: 300
    # Health check for ExternalSecret: apps use a wave −1 ExternalSecret as a
    # pre-sync hook (e.g. tailscale operator-oauth, excalidash-secrets).
    # Without this, ArgoCD cannot assess the hook's health and the sync hangs
    # forever on "waiting for healthy state of external-secrets.io/ExternalSecret".
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {}
      if obj.status ~= nil then
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
            else
              hs.status = "Degraded"
              hs.message = condition.message
            end
          end
        end
      end
      if hs.status == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for ExternalSecret to sync"
      end
      return hs
    # Health check for CronJob: the openagent chart ships CronJob/openagent-mcp-drift,
    # which runs every 15 min and intentionally exits non-zero when MCP drift is
    # detected. ArgoCD's built-in CronJob health check marks that "Degraded"
    # ("CronJob has not completed its last execution successfully") whenever
    # lastSuccessfulTime < lastScheduleTime, which blocks auto-sync retries
    # ("Skipping auto-sync: will not retry for revision") and needs a manual patch.
    # This custom check keeps the drift signal visible in Job logs while reporting
    # the CronJob Healthy, so a real drift finding does not take the whole
    # Application's sync/health hostage.
    resource.customizations.health.batch_CronJob: |
      hs = {}
      -- Suspended CronJobs do not run; surface them as Suspended.
      if obj.spec ~= nil and obj.spec.suspend == true then
        hs.status = "Suspended"
        hs.message = "CronJob is suspended"
        return hs
      end
      -- No status yet: the CronJob has not been scheduled.
      if obj.status == nil or obj.status.lastScheduleTime == nil then
        hs.status = "Healthy"
        hs.message = "CronJob has not been scheduled yet"
        return hs
      end
      -- The CronJob has been scheduled. If the last run did not succeed, report
      -- Healthy (not Degraded, not Progressing) so ArgoCD keeps the app in sync
      -- and keeps retrying; the drift signal stays visible in the Job's logs.
      if obj.status.lastSuccessfulTime == nil or obj.status.lastSuccessfulTime < obj.status.lastScheduleTime then
        hs.status = "Healthy"
        hs.message = "Last scheduled run did not succeed — check Job logs (drift?)"
        return hs
      end
      hs.status = "Healthy"
      hs.message = "CronJob completed its last scheduled run successfully"
      return hs

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ API Server                                                               │
# └──────────────────────────────────────────────────────────────────────────┘
server:
  replicas: 2
  # Verified 7d max working set: 110MiB (115,056,640 B). Limit 384Mi = 3.5x.
  # The request is HPA-keyed (targetMemoryUtilizationPercentage: 70 below), so
  # it cannot be pushed to its floor: 256Mi keeps the 70% target at 179Mi, above
  # the verified peak, so the HPA still rests at minReplicas instead of pinning
  # maxReplicas: 4 forever.
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "384Mi"
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
  ingressGrpc:
    enabled: false
  ingress:
    enabled: false
  service:
    labels:
      app: argocd-server
    type: NodePort

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Repo Server                                                              │
# └──────────────────────────────────────────────────────────────────────────┘
repoServer:
  replicas: 2
  # Verified 7d max working set: 355MiB (372,682,752 B) — 2Gi was a 5.8x ceiling.
  # 768Mi is 2.2x. The 512Mi request is deliberately NOT lowered even though it
  # is 1.4x the peak: with targetMemoryUtilizationPercentage: 70 the HPA target
  # sits at 358Mi, i.e. right on the verified peak, and any lower request would
  # make the HPA pin maxReplicas: 4 permanently — costing more memory than the
  # request saves.
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      memory: "768Mi"
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ApplicationSet Controller                                                │
# └──────────────────────────────────────────────────────────────────────────┘
applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  # Verified 7d max working set: 105MiB (110,243,840 B). No HPA on this
  # controller, so the request is free to track reality: 192Mi is 1.8x the peak,
  # 256Mi limit 2.4x.
  resources:
    requests:
      cpu: "250m"
      memory: "192Mi"
    limits:
      memory: "256Mi"

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Redis                                                                    │
# └──────────────────────────────────────────────────────────────────────────┘
# Redis runs the timeseries/ReJSON/search modules and had OOMKilled 21 times at
# the 512Mi limit (historical cgroup count; the Sept 2026 node-OOM reset its
# containers too). 1Gi limit to match controller/repoServer's availability bump.
# The 21 historical OOMKills above were node-level (the Sept 2026 node OOM reset
# these containers), not redis exceeding its 512Mi cgroup: the verified 7d max
# working set is 33.7MiB (35,389,440 B). 256Mi still gives 7.6x headroom for the
# timeseries/ReJSON modules, and 64Mi request covers the verified peak twice over.
redis:
  resources:
    requests:
      cpu: "250m"
      memory: "64Mi"
    limits:
      memory: "256Mi"
  pdb:
    enabled: true
    minAvailable: 1

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Dex Server                                                               │
# └──────────────────────────────────────────────────────────────────────────┘
dex:
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# ┌──────────────────────────────────────────────────────────────────────────┐
# │ Notifications Controller                                                 │
# └──────────────────────────────────────────────────────────────────────────┘
notifications:
  pdb:
    enabled: true
    minAvailable: 1
  # Verified 7d max working set: 75.5MiB (79,171,584 B). Request already tracks
  # it (128Mi = 1.7x); the limit was 3.4x and drops to 192Mi (2.5x).
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "192Mi"
